name: profile-insight-engine

x-app-image: &app-image
  image: profile-insight-engine:${APP_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12.10-slim-bookworm}
      TESSDATA_BEST_REVISION: ${TESSDATA_BEST_REVISION:-e12c65a915945e4c28e237a9b52bc4a8f39a0cec}

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      APP_DB_USER: ${APP_DB_USER:?APP_DB_USER must be set in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ./deploy/postgres/init/01-create-app-role.sh
        target: /docker-entrypoint-initdb.d/01-create-app-role.sh
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  migrate:
    <<: *app-image
    restart: "no"
    command: ["python", "-m", "alembic", "-c", "src/infrastructure/alembic.ini", "upgrade", "head"]
    environment:
      PROFILE_INSIGHT_DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?set POSTGRES_DB}"
      PROFILE_INSIGHT_TESSDATA_DIR: /usr/local/share/tessdata_best
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      HOME: /tmp
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  app:
    <<: *app-image
    restart: unless-stopped
    init: true
    environment:
      PROFILE_INSIGHT_DATABASE_URL: "postgresql+asyncpg://${APP_DB_USER:?set APP_DB_USER}:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:?set POSTGRES_DB}"
      PROFILE_INSIGHT_TESSDATA_DIR: /usr/local/share/tessdata_best
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      HOME: /tmp
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3).read(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    stop_grace_period: 2m
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=2g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  proxy:
    image: ${NGINX_IMAGE:-nginx:stable-alpine}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - target: 80
        published: "80"
        host_ip: 0.0.0.0
        protocol: tcp
      - target: 443
        published: "443"
        host_ip: 0.0.0.0
        protocol: tcp
    volumes:
      - type: bind
        source: ./deploy/nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./deploy/tls
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./deploy/secrets
        target: /etc/nginx/auth
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /var/cache/nginx/client_temp:rw,nosuid,nodev,noexec,size=512m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
      - backend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  postgres-data:
