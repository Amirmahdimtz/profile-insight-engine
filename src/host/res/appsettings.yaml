profile_analysis:
  max_images: 50
  max_image_size_mb: 12
  max_image_pixels: 40000000
image:
  max_dimension: 2048
  allowed_mime_types:
    - image/jpeg
    - image/png
    - image/webp
ocr:
  provider: tesseract
  executable: tesseract
  languages:
    - fas
    - eng
  page_segmentation_mode: 1
  timeout_seconds: 30
  model_id: tessdata-default-fas-eng
  config_version: phase4-ocr-v1
vision:
  provider: llama_cpp
  base_url: http://127.0.0.1:8080
  runtime_executable: llama-server
  request_timeout_seconds: 120
  startup_timeout_seconds: 600
  model_acquisition_timeout_seconds: 3600
  model_id: ggml-org/Qwen2.5-VL-3B-Instruct-GGUF:Q4_K_M
  model_version: hf-main-q4_k_m
  config_version: phase5-vision-v1
  max_tokens: 768
  temperature: 0.0
  top_p: 1.0
  seed: 0
  confidence_semantics: model_self_reported_uncalibrated
embedding:
  provider: transformers
  model_id: google/siglip2-base-patch16-224
  model_revision: main
  config_version: phase6-embedding-v1-candidate
  device: cpu
  batch_size: 8
  local_files_only: false
  theme_similarity_threshold: 0.25
  near_duplicate_similarity_threshold: 0.95
