profile_analysis:
  max_images: 50
  max_image_size_mb: 12
  max_image_pixels: 40000000
image:
  max_dimension: 2048
  allowed_mime_types:
    - image/jpeg
    - image/png
    - image/webp
ocr:
  provider: tesseract
  executable: tesseract
  languages:
    - fas
    - eng
  page_segmentation_mode: 1
  timeout_seconds: 30
  model_id: tessdata-default-fas-eng
  config_version: phase4-ocr-v1
